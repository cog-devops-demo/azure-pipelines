# risk-batch-ci CI workflow
# Migrated from: services/risk-batch/azure-pipelines.yml (ADO pipeline ID 104)
# Stack: Python 3.11 / pytest
# Original template source: shared-ci-platform @ staging/preprod
#
# ADO templates inlined:
#   - templates/build/build-python.yml      (staging/preprod: suite-level retry loop,
#                                            pytest-rerunfailures, preprod validation stamp)
#   - templates/test/run-tests.yml          (testFramework: pytest)
#   - templates/release/release-standard.yml (environment: dev, deployStrategy: rolling,
#                                            requireApproval: false, notifyReleaseOrchestrator: true)
#
# services/risk-batch/pipeline-fragments/build-python-local.yml is an unreferenced
# local fork of the python build template (inventory risk R4). It is NOT consumed by
# ADO pipeline 104 and is intentionally not migrated.
#
# Mapping document: docs/migration/risk-batch-ci-ado-to-gha-mapping.md

name: risk-batch-ci

on:
  push:
    branches:
      - main
    paths:
      - 'services/risk-batch/**'
      - '.github/workflows/risk-batch-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'services/risk-batch/**'
      - '.github/workflows/risk-batch-ci.yml'

permissions:
  contents: read

env:
  # --- mapped from: ADO variables (artifactName) ---
  ARTIFACT_NAME: risk-batch-dist
  # --- mapped from: build-python.yml parameters (pythonVersion, requirementsFile, testRetryCount) ---
  PYTHON_VERSION: '3.11'
  REQUIREMENTS_FILE: services/risk-batch/requirements.txt
  TEST_RETRY_COUNT: '3'
  # --- mapped from: ADO predefined variables consumed by build-tools/scripts/*.py ---
  BUILD_SOURCEBRANCH: ${{ github.ref }}
  BUILD_SOURCEVERSION: ${{ github.sha }}
  BUILD_BUILDID: ${{ github.run_id }}
  BUILD_DEFINITIONNAME: ${{ github.workflow }}
  BUILD_REQUESTEDFOR: ${{ github.actor }}
  PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  # --- mapped from: stage Build ("Build risk-batch") / job build ---
  build:
    name: Build risk-batch
    runs-on: ubuntu-latest
    defaults:
      run:
        # The ADO templates use root-relative src/ and tests/, while the pipeline's
        # requirementsFile points into services/risk-batch. The service tree is the
        # intended working directory.
        working-directory: services/risk-batch
    steps:
      # --- mapped from: implicit ADO source checkout ---
      - name: Checkout
        uses: actions/checkout@v4

      # --- mapped from: $(Build.ArtifactStagingDirectory) (pre-created by ADO agents) ---
      - name: Create artifact staging directory
        run: |
          mkdir -p "$RUNNER_TEMP/staging"
          echo "BUILD_ARTIFACTSTAGINGDIRECTORY=$RUNNER_TEMP/staging" >> "$GITHUB_ENV"

      # --- mapped from: UsePythonVersion@0 (build-python.yml) ---
      - name: Use Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # --- mapped from: script "Install dependencies" (build-python.yml) ---
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r "$GITHUB_WORKSPACE/$REQUIREMENTS_FILE"

      # --- mapped from: script "Run linting checks" (build-python.yml, enableLinting=true) ---
      - name: Run linting checks
        run: |
          pip install flake8 black mypy
          flake8 src/ --max-line-length=120
          black --check src/

      # --- mapped from: script "Run tests with coverage (retry-enabled)" (build-python.yml, runTests=true) ---
      # pytest-junitxml (listed in the ADO template) does not exist on PyPI; JUnit XML
      # output is built into pytest, so it is omitted here.
      - name: Run tests with coverage (retry-enabled)
        run: |
          pip install pytest pytest-cov pytest-rerunfailures
          RETRY=0
          MAX_RETRY="$TEST_RETRY_COUNT"
          until pytest tests/ \
            --junitxml="$BUILD_ARTIFACTSTAGINGDIRECTORY/test-results.xml" \
            --cov=src/ \
            --cov-report=xml:"$BUILD_ARTIFACTSTAGINGDIRECTORY/coverage.xml" \
            --reruns 2 --reruns-delay 5; do
            RETRY=$((RETRY + 1))
            if [ "$RETRY" -ge "$MAX_RETRY" ]; then
              echo "Tests failed after $MAX_RETRY retries"
              exit 1
            fi
            echo "Test retry $RETRY of $MAX_RETRY..."
            sleep 10
          done

      # --- mapped from: PublishTestResults@2 (build-python.yml, condition: always()) ---
      - name: Publish test results (build-python)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-batch-build-test-results
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}/test-results.xml
          if-no-files-found: warn

      # --- mapped from: script "Build distribution" (build-python.yml, publishArtifacts=true) ---
      - name: Build distribution
        run: |
          python setup.py sdist bdist_wheel
          cp -r dist/ "$BUILD_ARTIFACTSTAGINGDIRECTORY/dist/"

      # --- mapped from: PublishBuildArtifacts@1 (build-python.yml) ---
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}
          if-no-files-found: error

      # --- mapped from: script "Register artifact in artifact-registry" (build-python.yml) ---
      - name: Register artifact in artifact-registry (Artifactory)
        if: github.event_name == 'push'
        env:
          AGENT_NAME: ${{ runner.name }}
        run: |
          python "$GITHUB_WORKSPACE/build-tools/scripts/publish_artifact.py" \
            --name "$ARTIFACT_NAME" \
            --registry artifact-registry \
            --build-id "$BUILD_BUILDID"

      # --- mapped from: script "Stamp preprod validation marker" (build-python.yml @ staging/preprod) ---
      - name: Stamp preprod validation marker
        run: |
          echo "Preprod artifact validation stamp"
          echo "$BUILD_BUILDID" > "$BUILD_ARTIFACTSTAGINGDIRECTORY/preprod-stamp.txt"

      # --- mapped from: script "Create test results directory" (run-tests.yml) ---
      - name: Create test results directory
        run: mkdir -p "$BUILD_ARTIFACTSTAGINGDIRECTORY/test-results"

      # --- mapped from: script "Run pytest" (run-tests.yml, testFramework=pytest) ---
      - name: Run pytest
        run: |
          pytest tests/ \
            --junitxml="$BUILD_ARTIFACTSTAGINGDIRECTORY/test-results/results.xml" \
            --tb=short

      # --- mapped from: PublishTestResults@2 (run-tests.yml, publishResults=true, condition: always()) ---
      - name: Publish test results (run-tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-batch-test-results
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}/test-results
          if-no-files-found: warn

      # --- mapped from: script "Normalize test results" (run-tests.yml, condition: always()) ---
      - name: Normalize test results
        if: always()
        run: |
          python "$GITHUB_WORKSPACE/build-tools/scripts/normalize_test_results.py" \
            --input-dir "$BUILD_ARTIFACTSTAGINGDIRECTORY/test-results" \
            --output "$BUILD_ARTIFACTSTAGINGDIRECTORY/normalized-results.json"

  # --- mapped from: stage Deploy_dev ("Deploy to dev") / deployment job deploy (release-standard.yml) ---
  deploy_dev:
    name: Deploy to dev
    needs: build
    # ADO stage had no condition (requireApproval=false) but only ever ran on main
    # pushes; pull_request runs must not deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      # --- mapped from: $(Build.SourcesDirectory) reference in release-standard.yml ---
      - name: Checkout
        uses: actions/checkout@v4

      # --- mapped from: $(Build.ArtifactStagingDirectory) (fresh runner has no staging dir) ---
      - name: Create artifact staging directory
        run: |
          mkdir -p "$RUNNER_TEMP/staging"
          echo "BUILD_ARTIFACTSTAGINGDIRECTORY=$RUNNER_TEMP/staging" >> "$GITHUB_ENV"

      # --- mapped from: download: current / artifact: risk-batch-dist (release-standard.yml) ---
      - name: Download ${{ env.ARTIFACT_NAME }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/artifacts/${{ env.ARTIFACT_NAME }}

      # --- mapped from: script "Execute deployment" (release-standard.yml, deployStrategy=rolling) ---
      - name: Execute deployment
        run: |
          echo "Deploying $ARTIFACT_NAME to dev"
          echo "Strategy: rolling"

      # --- mapped from: script "Notify release-orchestrator" (release-standard.yml, notifyReleaseOrchestrator=true) ---
      - name: Notify release-orchestrator (D2)
        run: |
          python build-tools/scripts/notify_release_orchestrator.py \
            --service "$ARTIFACT_NAME" \
            --env dev \
            --build-id "$BUILD_BUILDID" \
            --status success

      # --- mapped from: script "Generate compliance attestation" (release-standard.yml) ---
      - name: Generate compliance attestation
        env:
          AGENT_OS: ${{ runner.os }}
        run: |
          python build-tools/scripts/generate_attestation.py \
            --artifact "$ARTIFACT_NAME" \
            --env dev \
            --build-id "$BUILD_BUILDID"

      # --- mapped from: deployment-job outputs on agent disk (release-standard.yml) ---
      - name: Upload deployment attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-batch-dev-attestation
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}
          if-no-files-found: warn
