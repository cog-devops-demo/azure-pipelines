# frontend-workbench-ci CI workflow
# Migrated from: services/frontend-workbench/azure-pipelines.yml (ADO pipeline ID 106)
# Stack: Node.js 18.x / TypeScript (React client bundle + SSR bundle)
# Original template source: team/frontend-custom branch (alt-templates/frontend, owned by team-frontend)
#
# ADO templates inlined:
#   - alt-templates/frontend/frontend-build.yml   (nodeVersion 18.x, framework react, enableSSR true,
#                                                  artifactName frontend-workbench-bundle)
#   - alt-templates/frontend/frontend-deploy.yml  (environment dev, then staging; cdnPurge default true)
#
# ADO variable groups referenced by pipeline 106:
#   - shared-ci-secrets (VG 201)     — not consumed by any step in this pipeline
#   - frontend-cdn-config (VG 210)   — CDN_ENDPOINT, CDN_STORAGE_ACCOUNT (vars);
#                                      CDN_STORAGE_KEY, CDN_PURGE_API_KEY (secrets)
#     Supplied per GitHub environment (dev-frontend / staging-frontend); the inlined
#     deploy template only echoes, so the values are exposed to the job but not yet used.
# See docs/migration/frontend-workbench-ci-ado-to-gha-mapping.md.

name: frontend-workbench-ci

# --- mapped from: trigger.branches.include / trigger.paths.include ---
# ADO `feature/*` is single-level; GHA `feature/**` is recursive (intentional broadening).
# pull_request is an addition — the ADO pipeline had no PR trigger.
# The workflow file is included so workflow-only revisions run.
on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'services/frontend-workbench/**'
      - '.github/workflows/frontend-workbench-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'services/frontend-workbench/**'
      - '.github/workflows/frontend-workbench-ci.yml'

permissions:
  contents: read

# --- mapped from: variables (artifactName) ---
env:
  ARTIFACT_NAME: frontend-workbench-bundle
  SERVICE_DIR: services/frontend-workbench
  # --- mapped from: $(Build.ArtifactStagingDirectory) ---
  BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}/staging

defaults:
  run:
    shell: bash

jobs:
  # --- mapped from: stage Build / job build (alt-templates/frontend/frontend-build.yml@team/frontend-custom) ---
  build:
    name: Build frontend-workbench
    # --- mapped from: pool.vmImage ubuntu-latest ---
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: services/frontend-workbench
    steps:
      # --- mapped from: implicit ADO checkout ---
      - uses: actions/checkout@v4

      # --- mapped from: NodeTool@0 (versionSpec 18.x) ---
      - name: Install Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      # --- mapped from: script `npm ci` ---
      - name: Install dependencies
        run: npm ci

      # --- mapped from: script `npm run lint` ---
      - name: Lint check
        run: npm run lint

      # --- mapped from: script `npm run build:${{ parameters.framework }}` (framework=react) ---
      - name: Build react app
        run: npm run build:react

      # --- mapped from: `${{ if eq(parameters.enableSSR, true) }}` -> script `npm run build:ssr` (enableSSR=true) ---
      - name: Build SSR bundle
        run: npm run build:ssr

      # --- mapped from: script `npm test -- --ci --coverage` ---
      - name: Run tests
        run: npm test -- --ci --coverage

      # --- mapped from: ArchiveFiles@2 (rootFolderOrFile build/, includeRootFolder false, archiveType zip,
      #                  archiveFile $(Build.ArtifactStagingDirectory)/<artifactName>.zip) ---
      - name: Archive frontend bundle
        run: |
          mkdir -p "$BUILD_ARTIFACTSTAGINGDIRECTORY"
          (cd build && zip -qr "$BUILD_ARTIFACTSTAGINGDIRECTORY/$ARTIFACT_NAME.zip" .)
          ls -l "$BUILD_ARTIFACTSTAGINGDIRECTORY"

      # --- mapped from: script `npx lhci autorun --collect.staticDistDir=build/ || true` ---
      # Preserved verbatim, including `|| true` (the audit never fails the build in ADO).
      - name: Run Lighthouse CI audit
        run: npx lhci autorun --collect.staticDistDir=build/ || true

      # --- mapped from: PublishBuildArtifacts@1 (pathToPublish $(Build.ArtifactStagingDirectory),
      #                  artifactName '<artifactName>-$(Build.BuildId)') ---
      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ github.run_id }}
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}
          if-no-files-found: error

  # --- mapped from: stage DeployFrontend_dev (alt-templates/frontend/frontend-deploy.yml, environment=dev) ---
  # ADO stage has no explicit dependsOn/condition: it runs after Build (implicit sequential dependency)
  # for every triggering push. Gated to push events so the added pull_request trigger never deploys.
  deploy_frontend_dev:
    name: Deploy frontend to dev
    needs: build
    if: github.event_name == 'push'
    # --- mapped from: deployment job pool.vmImage ubuntu-latest ---
    runs-on: ubuntu-latest
    # --- mapped from: deployment job `environment: '${{ parameters.environment }}-frontend'` (ADO env dev-frontend, no checks) ---
    environment:
      name: dev-frontend
      url: ${{ vars.CDN_ENDPOINT }}
    env:
      DEPLOY_ENVIRONMENT: dev
      # --- mapped from: variable group frontend-cdn-config (VG 210) ---
      CDN_ENDPOINT: ${{ vars.CDN_ENDPOINT }}
      CDN_STORAGE_ACCOUNT: ${{ vars.CDN_STORAGE_ACCOUNT }}
      CDN_STORAGE_KEY: ${{ secrets.CDN_STORAGE_KEY }}
      CDN_PURGE_API_KEY: ${{ secrets.CDN_PURGE_API_KEY }}
    steps:
      # --- mapped from: implicit ADO checkout ---
      - uses: actions/checkout@v4

      # --- mapped from: `download: current` — fresh runner has no staging dir yet ---
      - name: Prepare staging directory
        run: mkdir -p "$BUILD_ARTIFACTSTAGINGDIRECTORY"

      # --- mapped from: `download: current` (artifact <artifactName>-$(Build.BuildId)) ---
      - name: Download frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ github.run_id }}
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}

      # --- mapped from: script 'Upload to CDN' ---
      - name: Upload to CDN
        run: |
          echo "Uploading static assets to CDN..."
          echo "Environment: $DEPLOY_ENVIRONMENT"
          test -f "$BUILD_ARTIFACTSTAGINGDIRECTORY/$ARTIFACT_NAME.zip"

      # --- mapped from: `${{ if eq(parameters.cdnPurge, true) }}` -> script 'Purge CDN cache' (cdnPurge default true) ---
      - name: Purge CDN cache
        run: |
          echo "Purging CDN cache for $DEPLOY_ENVIRONMENT..."

      # --- mapped from: script 'Health check' (curl -sf https://dev.example.com/health || exit 1) ---
      - name: Health check
        run: |
          echo "Verifying deployment health..."
          curl -sf "https://$DEPLOY_ENVIRONMENT.example.com/health" || exit 1

  # --- mapped from: stage DeployFrontend_staging (alt-templates/frontend/frontend-deploy.yml, environment=staging) ---
  # ADO stage has no explicit dependsOn/condition: it runs after DeployFrontend_dev for every triggering
  # push, including feature/* branches (pre-existing gap noted in the ADO YAML; preserved, not fixed).
  # The staging-frontend environment's approval check is the only promotion gate, as in ADO.
  deploy_frontend_staging:
    name: Deploy frontend to staging
    needs: deploy_frontend_dev
    if: github.event_name == 'push'
    # --- mapped from: deployment job pool.vmImage ubuntu-latest ---
    runs-on: ubuntu-latest
    # --- mapped from: deployment job `environment: 'staging-frontend'` (ADO approval check: 1 team-frontend approver) ---
    environment:
      name: staging-frontend
      url: ${{ vars.CDN_ENDPOINT }}
    env:
      DEPLOY_ENVIRONMENT: staging
      # --- mapped from: variable group frontend-cdn-config (VG 210) ---
      CDN_ENDPOINT: ${{ vars.CDN_ENDPOINT }}
      CDN_STORAGE_ACCOUNT: ${{ vars.CDN_STORAGE_ACCOUNT }}
      CDN_STORAGE_KEY: ${{ secrets.CDN_STORAGE_KEY }}
      CDN_PURGE_API_KEY: ${{ secrets.CDN_PURGE_API_KEY }}
    steps:
      # --- mapped from: implicit ADO checkout ---
      - uses: actions/checkout@v4

      # --- mapped from: `download: current` — fresh runner has no staging dir yet ---
      - name: Prepare staging directory
        run: mkdir -p "$BUILD_ARTIFACTSTAGINGDIRECTORY"

      # --- mapped from: `download: current` (artifact <artifactName>-$(Build.BuildId)) ---
      - name: Download frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ github.run_id }}
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}

      # --- mapped from: script 'Upload to CDN' ---
      - name: Upload to CDN
        run: |
          echo "Uploading static assets to CDN..."
          echo "Environment: $DEPLOY_ENVIRONMENT"
          test -f "$BUILD_ARTIFACTSTAGINGDIRECTORY/$ARTIFACT_NAME.zip"

      # --- mapped from: `${{ if eq(parameters.cdnPurge, true) }}` -> script 'Purge CDN cache' (cdnPurge default true) ---
      - name: Purge CDN cache
        run: |
          echo "Purging CDN cache for $DEPLOY_ENVIRONMENT..."

      # --- mapped from: script 'Health check' (curl -sf https://staging.example.com/health || exit 1) ---
      - name: Health check
        run: |
          echo "Verifying deployment health..."
          curl -sf "https://$DEPLOY_ENVIRONMENT.example.com/health" || exit 1
