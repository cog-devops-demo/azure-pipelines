# Validates ADO-to-GHA pipeline migrations on every PR.
# Runs actionlint, compares ADO ↔ GHA structure, checks baselines,
# and posts a rich validation report as a PR comment.

name: validate-migration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'services/**/azure-pipelines*.yml'
      - 'docs/migration/ado-exports/**'
      - 'validation/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'services/**/azure-pipelines*.yml'
      - 'docs/migration/ado-exports/**'
      - 'validation/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  validate:
    name: Validate pipeline migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch template branches
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.7'
        run: |
          curl -sSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" -o /tmp/download-actionlint.bash
          bash /tmp/download-actionlint.bash "$ACTIONLINT_VERSION"
          sudo mv actionlint /usr/local/bin/

      - name: Lint all GHA workflows
        id: lint
        run: |
          set +e
          # shellcheck disable=SC2016  # the Go template is passed to actionlint verbatim
          LINT_OUTPUT=$(actionlint -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}%0A{{end}}' 2>&1)
          LINT_EXIT=$?
          printf '%s\n' "$LINT_OUTPUT"
          echo "exit_code=$LINT_EXIT" >> "$GITHUB_OUTPUT"
          if [ $LINT_EXIT -ne 0 ]; then
            echo "### actionlint found issues:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            actionlint >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "actionlint: all workflows valid" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Detect changed workflows and ADO sources
        id: detect
        env:
          DIFF_RANGE: ${{ github.event_name == 'push' && format('{0}..{1}', github.event.before, github.sha) || 'origin/main...HEAD' }}
        run: |
          if ! git rev-parse --verify -q "${DIFF_RANGE%%..*}^{commit}" >/dev/null; then
            DIFF_RANGE="HEAD~1..HEAD"   # first push on a branch has no "before" commit
          fi
          WORKFLOWS=$(git diff --name-only "$DIFF_RANGE" -- '.github/workflows/*.yml' | tr '\n' ' ')
          SOURCES=$(git diff --name-only "$DIFF_RANGE" -- 'services/**/azure-pipelines*.yml' 'docs/migration/ado-exports/**' | tr '\n' ' ')
          echo "workflows=$WORKFLOWS" >> "$GITHUB_OUTPUT"
          echo "sources=$SOURCES" >> "$GITHUB_OUTPUT"
          echo "Found changed workflows: $WORKFLOWS"
          echo "Found changed ADO sources: $SOURCES"

      - name: Run migration validation
        id: validate
        env:
          CHANGED_WORKFLOWS: ${{ steps.detect.outputs.workflows }}
          CHANGED_SOURCES: ${{ steps.detect.outputs.sources }}
        run: |
          REPORT=""

          # Map a workflow basename to "service|ADO definition name|ADO source|known".
          # The ADO source is a pipeline YAML, or an exported classic definition (.json).
          # "known" marks an explicitly mapped migration workflow: a missing source is
          # then a validation failure rather than a workflow we have no opinion about.
          map_workflow() {
            BASE="$1"
            SERVICE=""
            ADO_PIPELINE=""
            KNOWN=1
            ADO_NAME="$BASE"   # ADO definition name, when it differs from the workflow
            case "$BASE" in
              pricing-engine-ci)
                SERVICE="pricing-engine"
                ADO_PIPELINE="services/pricing-engine/azure-pipelines.yml"
                ;;
              portfolio-api-ci)
                SERVICE="portfolio-api"
                ADO_PIPELINE="services/portfolio-api/azure-pipelines.yml"
                ;;
              risk-batch-legacy)
                SERVICE="risk-batch"
                ADO_PIPELINE="services/risk-batch/azure-pipelines-legacy.yml"
                ;;
              risk-batch-*)
                SERVICE="risk-batch"
                ADO_PIPELINE="services/risk-batch/azure-pipelines.yml"
                ;;
              market-sim-ci)
                SERVICE="market-sim"
                ADO_PIPELINE="services/market-sim/azure-pipelines.yml"
                ;;
              ops-control-plane-ci)
                SERVICE="ops-control-plane"
                ADO_PIPELINE="services/ops-control-plane/azure-pipelines.yml"
                ;;
              frontend-workbench-ci)
                SERVICE="frontend-workbench"
                ADO_PIPELINE="services/frontend-workbench/azure-pipelines.yml"
                ;;
              settlement-gateway-ci)
                # classic (designer) ADO definition — no YAML in the repo
                SERVICE="settlement-gateway"
                ADO_NAME="settlement-gateway-classic"
                ADO_PIPELINE="docs/migration/ado-exports/settlement-gateway-classic.json"
                ;;
              regulatory-reporting-ci)
                SERVICE="regulatory-reporting"
                ADO_PIPELINE="services/regulatory-reporting/azure-pipelines.yml"
                ;;
              *)
                SERVICE="${BASE%-ci}"
                ADO_PIPELINE="services/${BASE%-ci}/azure-pipelines.yml"
                KNOWN=0
                ;;
            esac
            printf '%s|%s|%s|%s\n' "$SERVICE" "$ADO_NAME" "$ADO_PIPELINE" "$KNOWN"
          }

          missing_source_report() {
            printf '## Migration Validation Report\n\n**Service:** `%s`  \n**GHA Workflow:** `%s`\n\n| Check | Status | Details |\n|-------|--------|---------|\n| ADO Source | FAIL | mapped ADO source `%s` is missing |\n' "$1" "$2" "$3"
          }

          # An ADO source can change without its workflow changing (e.g. a refreshed
          # classic export); validate the workflow that maps to it as well.
          for wf in .github/workflows/*.yml; do
            [ -f "$wf" ] || continue
            case " $CHANGED_WORKFLOWS " in *" $wf "*) continue ;; esac
            IFS='|' read -r _ _ SRC KNOWN <<<"$(map_workflow "$(basename "$wf" .yml)")"
            [ "$KNOWN" = "1" ] || continue
            case " $CHANGED_SOURCES " in
              *" $SRC "*) CHANGED_WORKFLOWS="$CHANGED_WORKFLOWS $wf" ;;
            esac
          done

          for wf in $CHANGED_WORKFLOWS; do
            IFS='|' read -r SERVICE ADO_NAME ADO_PIPELINE KNOWN <<<"$(map_workflow "$(basename "$wf" .yml)")"
            if [ ! -f "$ADO_PIPELINE" ]; then
              if [ "$KNOWN" = "1" ]; then
                echo "Mapped ADO source missing for $wf: $ADO_PIPELINE"
                REPORT="${REPORT}$(missing_source_report "$SERVICE" "$wf" "$ADO_PIPELINE")"$'\n\n'
              else
                echo "No ADO source for $wf — skipping"
              fi
              continue
            fi

            echo "Validating: $SERVICE ($wf ↔ $ADO_PIPELINE)"
            RESULT=$(python validation/scripts/validate_migration.py \
              --service "$SERVICE" \
              --ado-pipeline "$ADO_PIPELINE" \
              --gha-workflow "$wf" \
              --baselines validation/baselines \
              --repo-root "$GITHUB_WORKSPACE")
            REPORT="${REPORT}${RESULT}"$'\n\n'
            echo "$SERVICE|$ADO_NAME|$(basename "$wf")" >> /tmp/parity-targets.txt
          done

          # Full scan on manual dispatch only
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -z "$CHANGED_WORKFLOWS" ]; then
            for wf in .github/workflows/*.yml; do
              [ -f "$wf" ] || continue
              IFS='|' read -r SERVICE ADO_NAME ADO_PIPELINE KNOWN <<<"$(map_workflow "$(basename "$wf" .yml)")"
              [ -f "$ADO_PIPELINE" ] || continue

              echo "Validating (full scan): $SERVICE"
              RESULT=$(python validation/scripts/validate_migration.py \
                --service "$SERVICE" \
                --ado-pipeline "$ADO_PIPELINE" \
                --gha-workflow "$wf" \
                --baselines validation/baselines \
                --repo-root "$GITHUB_WORKSPACE")
              REPORT="${REPORT}${RESULT}"$'\n\n'
              echo "$SERVICE|$ADO_NAME|$(basename "$wf")" >> /tmp/parity-targets.txt
            done
          fi

          if [ -z "$REPORT" ]; then
            REPORT="No migration workflows detected for validation."
          fi

          # Write report to file (PR comment body has a size limit)
          echo "$REPORT" > /tmp/validation-report.md
          cat /tmp/validation-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

          FAILED=$(grep -c '| FAIL |' /tmp/validation-report.md || true)
          echo "failed_checks=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Runtime parity against live ADO runs
        id: parity
        env:
          AZURE_DEVOPS_EXT_PAT: ${{ secrets.AZURE_DEVOPS_EXT_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          ADO_ORG: ${{ vars.ADO_ORG || 'danagajewski' }}
          ADO_PROJECT: ${{ vars.ADO_PROJECT || 'danagajewski-demo' }}
          PARITY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PARITY_PR: ${{ github.event.pull_request.number }}
        run: |
          [ -f /tmp/parity-targets.txt ] || exit 0
          MISMATCH=0
          while IFS='|' read -r SERVICE ADO_NAME WORKFLOW_FILE; do
            [ -n "$SERVICE" ] || continue
            set +e
            OUT=$(python validation/scripts/parity_report.py \
              --service "$SERVICE" \
              --ado-org "$ADO_ORG" \
              --ado-project "$ADO_PROJECT" \
              --ado-pipeline "$ADO_NAME" \
              --gh-repo "$GITHUB_REPOSITORY" \
              --gh-workflow "$WORKFLOW_FILE" \
              --sha "$PARITY_SHA" \
              --wait-seconds 600 \
              ${PARITY_PR:+--pr "$PARITY_PR"})
            STATUS=$?
            set -e
            [ $STATUS -eq 0 ] || MISMATCH=1
            printf '\n%s\n' "$OUT" >> /tmp/validation-report.md
            printf '\n%s\n' "$OUT" >> "$GITHUB_STEP_SUMMARY"
          done < /tmp/parity-targets.txt
          echo "mismatch=$MISMATCH" >> "$GITHUB_OUTPUT"

      - name: Post validation report to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/validation-report.md', 'utf8');
            const body = `### Pipeline Migration Validation\n\n${report}\n\n---\n*Auto-generated by [validate-migration](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('### Pipeline Migration Validation')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on lint, scorecard or parity failures
        if: always() && steps.validate.outcome != 'skipped'
        env:
          LINT_EXIT: ${{ steps.lint.outputs.exit_code }}
          FAILED_CHECKS: ${{ steps.validate.outputs.failed_checks }}
          PARITY_MISMATCH: ${{ steps.parity.outputs.mismatch }}
        run: |
          STATUS=0
          if [ "${PARITY_MISMATCH:-0}" != "0" ]; then
            echo "live ADO ↔ GHA parity mismatch — see the runtime parity section"
            STATUS=1
          fi
          if [ "${LINT_EXIT:-0}" != "0" ]; then
            echo "actionlint reported problems"
            STATUS=1
          fi
          if [ "${FAILED_CHECKS:-0}" != "0" ]; then
            echo "$FAILED_CHECKS scorecard check(s) failed — see the validation report"
            STATUS=1
          fi
          exit $STATUS

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-validation-report
          path: /tmp/validation-report.md
